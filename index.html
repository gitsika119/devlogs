<body>

  <div class="diagonal-stripe"></div>

  <aside class="vertical-header">

  </aside>

  <div class="menu-container">
    <main class="log-index">
      
      <a href="logs/hardware-thoughts.html" class="persona-card" style="--i: 0;">
        <div class="card-content">
          <span class="log-number">LOG_03</span>

      <a href="logs/asml-semiconductor.html" class="persona-card" style="--i: 1;">
        <div class="card-content">
          <span class="log-number">LOG_02</span>

    <footer class="index-footer">

    </footer>
  </div>

  <script>
    const cards = document.querySelectorAll('.persona-card');
    let currentIndex = 0;

    function updateSelection(index) {
      cards.forEach(card => card.classList.remove('active'));
      cards[index].classList.add('active');
      currentIndex = index;
    }

    // Keyboard Arrow Listeners (Desktop)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        let next = currentIndex + 1;
        if (next < cards.length) updateSelection(next);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        let prev = currentIndex - 1;
        if (prev >= 0) updateSelection(prev);
      } else if (e.key === 'Enter') {
        cards[currentIndex].click();
      }
    });

    // Desktop Mouse Sync
    if (window.innerWidth > 768) {
      cards.forEach((card, index) => {
        card.addEventListener('mouseenter', () => updateSelection(index));
      });
      // Initialize desktop with top selected
      updateSelection(0);
    }

    // Mobile Scroll-Spy Engine (Auto-selects top element during scroll)
    if (window.innerWidth <= 768) {
      const observerOptions = {
        root: null,
        // Targets elements crossing the upper-middle hot-zone of the mobile display
        rootMargin: '-20% 0px -60% 0px',
        threshold: 0.1
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const index = Array.from(cards).indexOf(entry.target);
            updateSelection(index);
          }
        });
      }, observerOptions);

      cards.forEach(card => observer.observe(card));
    }
  </script>
</body>
</html>
